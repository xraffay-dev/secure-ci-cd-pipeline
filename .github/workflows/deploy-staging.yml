name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Build Docker Image"]
    types: [completed]

env:
  IMAGE_TAG: latest

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Staging Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_STAGING_HOOK }}
